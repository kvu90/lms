# Workflow kiểm chứng khả năng deploy của stack tự host ngay trong CI.
#
# Mục đích: ruleset của nhánh main cần một status check chạy trên head
# của PR trước khi merge để bảo đảm head đó thật sự dựng được stack
# production tự host (compose.yaml ở gốc repo). Workflow này dựng
# toàn bộ stack từ chính head của PR trong runner CI, chờ API khỏe,
# kiểm tra trang gốc, rồi chờ Keycloak sẵn sàng và kiểm chứng nó
# boot khỏe (healthcheck của service + issuer trong tài liệu
# discovery của realm `master`). Job chạy hai kịch bản nối tiếp:
# mật khẩu bootstrap của Keycloak được đặt, rồi gỡ biến đó và
# chạy lại stack đòi Keycloak vẫn boot khỏe (trạng thái của môi
# trường triển khai sau khi kết thúc bootstrap); sau cùng dọn
# sạch. Nó KHÔNG deploy lên máy tự host
# thật — đường deploy production vẫn là Dokploy kéo từ main.
#
# Chuỗi status context của job dưới đây là "deploy-check / verify-stack"
# (theo khuôn "<tên workflow> / <tên job>") — đây là chuỗi cần chọn
# trong ruleset của nhánh main.
#
# Mọi lệnh compose trong workflow đều gộp thêm file override
# compose.ci.yaml (chỉ dùng trong CI) để các build dùng cache
# layer qua GitHub Actions cache; file compose.yaml chính giữ
# nguyên cho đường deploy thật.

name: deploy-check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Huỷ lượt kiểm của head cũ ngay khi PR có head mới: group tách riêng
# theo từng PR (dự phòng bằng ref cho lượt chạy tay qua workflow_dispatch)
# và mang tên workflow này nên không huỷ lẫn với workflow CI; cổng merge
# vẫn xét lượt completed/success của head cuối như cũ.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-stack:
    name: verify-stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Dựng builder Buildx (driver docker-container): driver mặc
      # định của Docker trên runner không xuất được cache layer, nên
      # cần builder này để cache_from/cache_to kiểu type=gha khai
      # trong compose.ci.yaml hoạt động (đọc cache từ GitHub
      # Actions cache trước khi build và ghi lại sau khi build).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Sinh file .env cho môi trường CI từ file mẫu: tám bí mật
      # được sinh ngẫu nhiên ngay trong job và không rời khỏi
      # runner — bảy bí mật bắt buộc (khai ${...:?} trong
      # compose.yaml) cộng mật khẩu tài khoản quản trị bootstrap
      # của Keycloak (compose nội suy biến này theo dạng có mặc
      # định rỗng, nhưng bootstrap cần giá trị thật ở lần khởi
      # động đầu tiên để Keycloak tạo được tài khoản quản trị
      # bootstrap); các biến còn lại
      # giữ nguyên mặc định của file mẫu, trong đó BETTER_AUTH_URL
      # và CORS_ORIGINS là http://localhost:8080 cho môi trường CI. Các
      # biến tuỳ chọn (MFA, Resend) giữ ở dạng comment trong file mẫu
      # nên vắng mặt hẳn — đúng trạng thái ứng dụng hỗ trợ.
      - name: Generate CI environment file
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 32)|" .env
          sed -i "s|^CONTROL_PLANE_POSTGRES_PASSWORD=.*|CONTROL_PLANE_POSTGRES_PASSWORD=$(openssl rand -hex 32)|" .env
          sed -i "s|^RUNTIME_POSTGRES_PASSWORD=.*|RUNTIME_POSTGRES_PASSWORD=$(openssl rand -hex 32)|" .env
          sed -i "s|^MIGRATOR_POSTGRES_PASSWORD=.*|MIGRATOR_POSTGRES_PASSWORD=$(openssl rand -hex 32)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^KEYCLOAK_DB_PASSWORD=.*|KEYCLOAK_DB_PASSWORD=$(openssl rand -hex 32)|" .env
          sed -i "s|^KEYCLOAK_ADMIN_PASSWORD=.*|KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 32)|" .env
          grep -q '^POSTGRES_PASSWORD=.\+' .env
          grep -q '^CONTROL_PLANE_POSTGRES_PASSWORD=.\+' .env
          grep -q '^RUNTIME_POSTGRES_PASSWORD=.\+' .env
          grep -q '^MIGRATOR_POSTGRES_PASSWORD=.\+' .env
          grep -q '^JWT_SECRET=.\+' .env
          grep -q '^BETTER_AUTH_SECRET=.\+' .env
          grep -q '^KEYCLOAK_DB_PASSWORD=.\+' .env
          grep -q '^KEYCLOAK_ADMIN_PASSWORD=.\+' .env

      - name: Validate compose configuration
        run: docker compose -f compose.yaml -f compose.ci.yaml config > /dev/null

      # Service migrate tự chạy trước và phải kết thúc thành công thì
      # api/worker mới khởi động (cổng depends_on trong compose), nên
      # lệnh up này bao phủ cả bước áp migration vào cơ sở dữ liệu
      # trống của runner.
      - name: Build and start the stack
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --build

      # Chờ tối đa khoảng 5 phút cho API khỏe qua cửa web (cổng 8080
      # là cổng của ứng dụng mà stack publish ra host; cổng 8085 của
      # Keycloak chỉ bind loopback cho tunnel). Quá hạn thì in trạng
      # thái stack và log của api + migrate để chẩn đoán rồi fail.
      - name: Wait for API health
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
              echo "API health OK after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "API health check timed out."
          docker compose -f compose.yaml -f compose.ci.yaml ps
          docker compose -f compose.yaml -f compose.ci.yaml logs api migrate
          exit 1

      - name: Check root page responds
        run: curl -sf http://localhost:8080/ -o /dev/null

      # Chờ Keycloak sẵn sàng rồi kiểm chứng nó boot khỏe,
      # theo hai khẳng định — khẳng định nào trượt cũng làm
      # job fail ngay tại bước này:
      # (1) healthcheck của chính service keycloak báo healthy:
      # healthcheck thăm /health/ready trên cổng quản trị 9000
      # bên trong container (cổng 9000 không publish ra host nên
      # runner không thăm trực tiếp được; trạng thái health đọc
      # qua docker inspect của container service).
      # (2) Tài liệu discovery của realm `master` qua cổng
      # loopback 8085 khẳng định issuer đúng tên miền công khai:
      # KC_HOSTNAME ghim issuer theo https://auth.fuckr.net nên
      # discovery trả issuer này dù request đi qua địa chỉ
      # loopback của runner. Realm `master` có sẵn trong mọi
      # bản cài Keycloak nên luôn khẳng định được; các realm
      # nghiệp vụ là dữ kiện vận hành do admin tạo trong trang
      # quản trị, không nằm trong stack CI này.
      - name: Verify Keycloak readiness
        run: |
          for attempt in $(seq 1 60); do
            container_id=$(docker compose -f compose.yaml -f compose.ci.yaml ps -q keycloak)
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id" 2>/dev/null || true)
            if [ "$health" = "healthy" ]; then
              echo "Keycloak healthy after ${attempt} attempt(s)."
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "Keycloak did not become healthy in time (last health status: ${health:-unknown})."
              docker compose -f compose.yaml -f compose.ci.yaml ps
              docker compose -f compose.yaml -f compose.ci.yaml logs keycloak kc-db
              exit 1
            fi
            sleep 5
          done
          issuer=$(curl -sf http://127.0.0.1:8085/realms/master/.well-known/openid-configuration | jq -er '.issuer')
          echo "Realm master discovery issuer: ${issuer}"
          if [ "$issuer" != "https://auth.fuckr.net/realms/master" ]; then
            echo "Unexpected issuer for realm master."
            exit 1
          fi

      # Kịch bản thứ hai: chạy lại stack với KEYCLOAK_ADMIN_PASSWORD
      # KHÔNG được đặt — đúng trạng thái của môi trường triển khai
      # sau khi kết thúc bootstrap (đã có tài khoản quản trị lâu
      # dài, tài khoản tạm đã xoá, biến mật khẩu đã gỡ khỏi môi
      # trường). Kịch bản trên luôn đặt biến này nên trạng thái đó
      # chưa từng được chạy trong CI, và production đã gãy đúng ở
      # trạng thái đó tối 02/11/2026 (issue #724): compose từng
      # ghim tên tài khoản bootstrap trong khi mật khẩu là biến
      # tuỳ chọn, nên lần tạo lại container đầu tiên sau khi gỡ
      # biến chết ở bước kiểm chứng cấu hình của Keycloak (lỗi
      # "bootstrap-admin-username available only when bootstrap
      # admin password is set", tiến trình thoát mã 2). Giữa hai
      # kịch bản không dọn volume: cơ sở dữ liệu của Keycloak đã
      # có realm master từ kịch bản trên — khớp trạng thái
      # production khi deploy lại sau khi kết thúc bootstrap.
      - name: Remove bootstrap admin password from CI environment
        run: |
          sed -i '/^KEYCLOAK_ADMIN_PASSWORD=/d' .env
          if grep -q '^KEYCLOAK_ADMIN_PASSWORD=.\+' .env; then
            echo "KEYCLOAK_ADMIN_PASSWORD is still set in .env."
            exit 1
          fi
          echo "KEYCLOAK_ADMIN_PASSWORD removed from .env."

      # Chỉ service keycloak nội suy biến vừa gỡ, nên lệnh up này
      # tạo lại đúng container keycloak với môi trường mới; các
      # service còn lại giữ nguyên.
      - name: Restart the stack without bootstrap admin password
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d

      # Chờ Keycloak đạt healthy trở lại trong trạng thái không
      # có mật khẩu bootstrap, rồi khẳng định lại issuer trong
      # tài liệu discovery của realm `master` như kịch bản trên.
      # Quá hạn thì in trạng thái stack và log của keycloak +
      # kc-db để chẩn đoán rồi fail.
      - name: Verify Keycloak readiness without bootstrap admin password
        run: |
          for attempt in $(seq 1 60); do
            container_id=$(docker compose -f compose.yaml -f compose.ci.yaml ps -q keycloak)
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id" 2>/dev/null || true)
            if [ "$health" = "healthy" ]; then
              echo "Keycloak healthy without bootstrap admin password after ${attempt} attempt(s)."
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "Keycloak did not become healthy without bootstrap admin password in time (last health status: ${health:-unknown})."
              docker compose -f compose.yaml -f compose.ci.yaml ps
              docker compose -f compose.yaml -f compose.ci.yaml logs keycloak kc-db
              exit 1
            fi
            sleep 5
          done
          issuer=$(curl -sf http://127.0.0.1:8085/realms/master/.well-known/openid-configuration | jq -er '.issuer')
          echo "Realm master discovery issuer: ${issuer}"
          if [ "$issuer" != "https://auth.fuckr.net/realms/master" ]; then
            echo "Unexpected issuer for realm master."
            exit 1
          fi

      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v
