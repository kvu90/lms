name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Both test suites (api and worker) run against lms_test — their
      # vitest configs pin that database name — so every step in this
      # job, the migration included, targets lms_test and nothing else.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lms_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-at-least-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate the test database from empty
        run: pnpm --filter @lms/api db:migrate
      - name: Build
        run: pnpm exec turbo run build
      - name: Typecheck
        run: pnpm exec turbo run typecheck
      - name: Lint
        run: pnpm exec turbo run lint
      - name: Test
        run: pnpm exec turbo run test
