name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test_api
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Each test suite owns its database — api: lms_test_api (created by
      # the postgres service via POSTGRES_DB), worker: lms_test_worker
      # (created by a step below) — because turbo runs the suites in
      # parallel and they must not share mutable global tables (the
      # outbox backlog race is the failure this isolation prevents).
      # The vitest configs pin those names; this job-level DATABASE_URL
      # only serves steps outside the suites (kept on the api database).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lms_test_api
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-at-least-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create the worker test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE lms_test_worker'
      - name: Migrate the test databases from empty
        run: |
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/lms_test_api pnpm --filter @lms/api db:migrate
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/lms_test_worker pnpm --filter @lms/api db:migrate
      - name: Build
        run: pnpm exec turbo run build
      - name: Typecheck
        run: pnpm exec turbo run typecheck
      # PROBE CHẨN ĐOÁN (chỉ cho PR thăm dò, không áp cho PR thật): tách
      # bước Test thành nhiều bước con để đọc kết luận từng nhóm qua API.
      - name: Test api-0 unit src
        if: always()
        run: pnpm --filter @lms/api exec vitest run src
      - name: Test api-1 access..cohort
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/access-capability.e2e-spec.ts test/access-seed-prune.e2e-spec.ts test/app.e2e-spec.ts test/auth-flow.e2e-spec.ts test/auth-social-sessions-flow.e2e-spec.ts test/availability-completion-flow.e2e-spec.ts test/badges-competency-flow.e2e-spec.ts test/behat-retro-flow.e2e-spec.ts test/better-auth-disabled.e2e-spec.ts test/better-auth-flow.e2e-spec.ts test/blog-read-gate.e2e-spec.ts test/client-ip-flow.e2e-spec.ts test/cohort-members-gate.e2e-spec.ts
      - name: Test api-2 completion..grades
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/completion-criteria-full-flow.e2e-spec.ts test/courses-flow.e2e-spec.ts test/curriculum-flow.e2e-spec.ts test/curriculum-frame-apply-flow.e2e-spec.ts test/curriculum-frame-course-teacher-flow.e2e-spec.ts test/curriculum-program-import-flow.e2e-spec.ts test/curriculum-question-links-flow.e2e-spec.ts test/custom-fields-flow.e2e-spec.ts test/enrol-groups-flow.e2e-spec.ts test/enrolments-list-gate.e2e-spec.ts test/event-log-flow.e2e-spec.ts test/files-flow.e2e-spec.ts test/grades-export-import-flow.e2e-spec.ts test/grades-questions-flow.e2e-spec.ts test/grades-vnedu-export-flow.e2e-spec.ts
      - name: Test api-3a messaging block/calendar/domain
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/messaging-block-visibility.e2e-spec.ts test/messaging-calendar-flow.e2e-spec.ts test/messaging-domain-flow.e2e-spec.ts
      - name: Test api-3b messaging presence/realtime/roster
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/messaging-presence-flow.e2e-spec.ts test/messaging-realtime-flow.e2e-spec.ts test/messaging-roster-flow.e2e-spec.ts
      - name: Test api-3c1 unread-stream
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/notification-unread-stream-flow.e2e-spec.ts
      - name: Test api-3c2a center-v2 test1 gop-30
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/notifications-center-v2-flow.e2e-spec.ts -t "30 thông báo điểm"
      - name: Test api-3c2b center-v2 test2 loc-nhom
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/notifications-center-v2-flow.e2e-spec.ts -t "lọc theo 3 nhóm"
      - name: Test api-3c2c center-v2 test3 phan-trang
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/notifications-center-v2-flow.e2e-spec.ts -t "phân trang con trỏ của danh sách gộp"
      - name: Test api-3c2d center-v2 test4 xoa-muc
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/notifications-center-v2-flow.e2e-spec.ts -t "xoá từng mục"
      - name: Test api-3c3 providers
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/notifications-providers-flow.e2e-spec.ts
      - name: Test api-4 openapi..uuidv7
        if: always()
        run: pnpm --filter @lms/api exec vitest run test/openapi-document.e2e-spec.ts test/platform-backup-payments-privacy-flow.e2e-spec.ts test/platform-hardening.e2e-spec.ts test/platform-i18n-flow.e2e-spec.ts test/platform-search-webservice-flow.e2e-spec.ts test/platform-user-journeys-flow.e2e-spec.ts test/question-bank-read-gate.e2e-spec.ts test/question-types-stimulus-flow.e2e-spec.ts test/question-usage-owner-gate.e2e-spec.ts test/quiz-flow.e2e-spec.ts test/site-config-flow.e2e-spec.ts test/social-flow.e2e-spec.ts test/users-flow.e2e-spec.ts test/uuidv7-primary-keys-flow.e2e-spec.ts
      - name: Test rest (worker/web/contracts/editor/config/ui)
        if: always()
        run: pnpm exec turbo run test --filter=@lms/worker --filter=@lms/web --filter=@lms/contracts --filter=@lms/editor --filter=@lms/config --filter=@lms/ui
      # PROBE M (chẩn đoán): chạy lại riêng file center-v2, ghi toàn bộ
      # output + dữ kiện môi trường vào file rồi đẩy lên branch
      # probe-log-capture để đọc qua API nội dung repo.
      - name: Capture center-v2 output
        if: always()
        run: |
          {
            echo "=== date ==="; date; date -u; echo "TZ env: ${TZ:-<unset>}"
            echo "=== pg facts ==="
            PGPASSWORD=postgres psql -h localhost -U postgres -d lms_test_api -c "show timezone" -c "select now() as pg_now, (now() at time zone 'Asia/Saigon') as saigon_wall, to_char((now() at time zone 'Asia/Saigon')::date, 'YYYY-MM-DD') as saigon_day"
            echo "=== node facts ==="
            node -e "const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Saigon',year:'numeric',month:'2-digit',day:'2-digit'}); console.log('node now:', new Date().toISOString(), 'saigonDay(now):', f.format(new Date()))"
            echo "=== vitest center-v2 (verbose) ==="
            pnpm --filter @lms/api exec vitest run test/notifications-center-v2-flow.e2e-spec.ts --reporter=verbose 2>&1 || true
          } > probe-n2-output.txt 2>&1
          git config user.email probe@ci.local
          git config user.name probe
          git checkout --orphan probe-log-capture
          git add -f probe-n2-output.txt
          git commit -m "probe: capture center-v2 output"
          git push -f origin probe-log-capture || echo "PUSH FAILED (token khong co quyen ghi)"
