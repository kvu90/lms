# compose.yaml ở gốc repo — stack production TỰ HOST toàn bộ hệ
# thống trên một máy (nền tảng đích: Dokploy quản lý chính file compose
# này, Cloudflare Tunnel công bố service web ra ngoài).
#
# Topology GIỮ NGUYÊN một-origin như đường chạy production hiện hành:
# trình duyệt chỉ nói chuyện với service web (cổng duy nhất được publish
# ra host); web proxy /api/*, /socket.io/*, /mcp và /.well-known/* về
# service api qua mạng nội bộ của compose (LMS_API_INTERNAL_URL), nên
# cookie đăng nhập và realtime hoạt động đúng như trước.
#
# Cách dùng:
#   cp .env.example .env   # rồi điền các giá trị bí mật thật
#   docker compose up -d --build
# Kiểm tra: curl http://localhost:8080/api/v1/health
#
# Migration cơ sở dữ liệu tự chạy ở mỗi lần khởi động stack: service
# migrate luôn thuộc stack và api/worker chỉ khởi động sau khi nó kết
# thúc thành công (depends_on điều kiện
# service_completed_successfully), nên cơ sở dữ liệu trống được tự
# dựng ở lần up đầu tiên. Cần áp riêng thì chạy tay vẫn được:
#   docker compose run --rm migrate
#
# Seed dữ liệu mẫu (CHỈ cho môi trường thử nghiệm, không chạy trên
# production thật): docker compose --profile seed run --rm seed
#
# postgres và redis KHÔNG publish cổng ra host — cần quản trị thì vào
# qua `docker compose exec postgres psql ...` hoặc
# `docker compose exec redis redis-cli ...`.

# Khối biến môi trường dùng chung cho service api và các service chạy
# một lần dựa trên image api (migrate, seed).
x-api-env: &api-env
  NODE_ENV: production
  # Mô hình role của kho nghiệp vụ (issue #586): tầng ứng dụng chạy
  # bằng role RUNTIME `lms_runtime` — không phải superuser, không sở
  # hữu đối tượng nào, chỉ có quyền dữ liệu tối thiểu do bước
  # migrate cấp (script runtime-roles-setup). Role và quyền được cấp
  # phát ở bước migrate trước khi api khởi động; mật khẩu của role
  # chỉ sống trong file .env của môi trường triển khai.
  DATABASE_URL: postgres://lms_runtime:${RUNTIME_POSTGRES_PASSWORD:?Can dat RUNTIME_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-lms}
  # Trần kết nối của pool nghiệp vụ phía api trong ngân sách kết nối
  # của cụm (issue #586) — xem ghi chú RUNTIME_POSTGRES_PASSWORD
  # trong .env.example để biết cách cộng ngân sách.
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  CONTROL_PLANE_POOL_MAX: ${CONTROL_PLANE_POOL_MAX:-4}
  # Database control plane (issue #580): database riêng `lms_control_plane`
  # trên cùng cụm Postgres, role kết nối riêng `lms_control_plane` — role
  # và database được cấp phát idempotent bởi bước migrate (script
  # control-plane-setup), không khai ở service postgres.
  CONTROL_PLANE_DATABASE_URL: postgres://lms_control_plane:${CONTROL_PLANE_POSTGRES_PASSWORD:?Can dat CONTROL_PLANE_POSTGRES_PASSWORD trong file .env}@postgres:5432/lms_control_plane
  # Database kho ngân hàng hệ thống (issue #585): database riêng trên
  # cùng cụm, role kết nối riêng — database và role được cấp phát
  # idempotent bởi bước migrate (script system-bank-setup). Khai báo
  # TRƠ như các biến tuỳ chọn phía dưới: Compose chỉ truyền vào
  # api/worker khi biến thật sự được đặt ở môi trường triển khai;
  # chưa đặt thì các route kho ngân hàng báo chưa cấu hình (503)
  # thay vì làm ứng dụng gãy kiểm tra biến môi trường (schema yêu
  # cầu độ dài tối thiểu khi biến CÓ MẶT). Service migrate khai
  # riêng biến này trong khối environment của nó.
  SYSTEM_BANK_DATABASE_URL:
  # Database kho riêng của trung tâm thí điểm nhantin (issue #587):
  # sổ đăng ký control plane chỉ giữ tham chiếu
  # `env:SPACE_NHANTIN_DATABASE_URL`, tầng ứng dụng đọc URL thật từ
  # biến này khi phân giải phiên theo trung tâm. Khai báo TRƠ như
  # SYSTEM_BANK_DATABASE_URL ở trên: Compose chỉ truyền vào
  # api/worker khi biến thật sự được đặt ở môi trường triển khai;
  # chưa đặt thì không có đường phân giải nào dùng tới biến và ứng
  # dụng không gãy kiểm tra biến môi trường.
  SPACE_NHANTIN_DATABASE_URL:
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?Can dat JWT_SECRET trong file .env}
  # Các biến tuỳ chọn có kiểm tra độ dài tối thiểu phía ứng dụng
  # (MFA_ENCRYPTION_KEY, RESEND_API_KEY, MAIL_FROM) khai báo TRƠ — khoá
  # không giá trị — như dưới đây: Compose chỉ truyền vào container khi
  # biến thật sự được đặt ở môi trường triển khai. Khuôn ${BIEN:-} luôn
  # tiêm chuỗi rỗng khi chưa cấu hình và làm ứng dụng lỗi kiểm tra biến
  # môi trường (schema yêu cầu độ dài tối thiểu khi biến CÓ MẶT), nên
  # không dùng khuôn đó cho các biến này.
  MFA_ENCRYPTION_KEY:
  BETTER_AUTH_ENABLED: ${BETTER_AUTH_ENABLED:-true}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Can dat BETTER_AUTH_SECRET trong file .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  MCP_AS_ENABLED: ${MCP_AS_ENABLED:-true}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
  RESEND_API_KEY:
  MAIL_FROM:
  FILE_STORAGE_DIR: /app/data/files

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Can dat POSTGRES_PASSWORD trong file .env}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      # PostgreSQL 18 đổi bố cục: mount phải đặt tại /var/lib/postgresql
      # (image tự quản thư mục con theo major version). Mount vào
      # /var/lib/postgresql/data như khuôn của bản 17 trở xuống sẽ làm
      # container lỗi khởi động.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    # Bật AOF để hàng đợi BullMQ và cache còn giữ được qua lần khởi động lại.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: 3100
    volumes:
      # Tệp tải lên (driver lưu trữ local mặc định) phải nằm trên volume
      # bền, nếu không sẽ mất mỗi lần tạo lại container.
      - api-files:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Worker dùng cùng role RUNTIME như api (issue #586 — xem
      # x-api-env): không superuser, không sở hữu đối tượng.
      DATABASE_URL: postgres://lms_runtime:${RUNTIME_POSTGRES_PASSWORD:?Can dat RUNTIME_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-lms}
      # Khung định tuyến theo trung tâm phía worker (issue #581) đọc
      # sổ đăng ký ở control plane qua đúng biến này như api — thiếu
      # nó thì mọi đường mở phiên theo trung tâm của worker ném lỗi
      # chưa cấu hình trong triển khai mặc định.
      CONTROL_PLANE_DATABASE_URL: postgres://lms_control_plane:${CONTROL_PLANE_POSTGRES_PASSWORD:?Can dat CONTROL_PLANE_POSTGRES_PASSWORD trong file .env}@postgres:5432/lms_control_plane
      SYSTEM_BANK_DATABASE_URL:
      SPACE_NHANTIN_DATABASE_URL:
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Can dat JWT_SECRET trong file .env}
      FILE_STORAGE_DIR: /app/data/files
      # Biến mail tuỳ chọn: khai báo trơ như x-api-env — chỉ truyền vào
      # container khi đã đặt thật ở môi trường triển khai.
      RESEND_API_KEY:
      MAIL_FROM:
    volumes:
      # Worker đọc/ghi cùng kho tệp tải lên với api.
      - api-files:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      LMS_API_INTERNAL_URL: http://api:3100
    ports:
      # Cổng duy nhất của stack được publish ra host. Khi gắn Cloudflare
      # Tunnel, tunnel trỏ vào đúng cổng này của máy host.
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Áp migration (thư mục drizzle đi kèm image api) rồi kết thúc.
  # Service này luôn thuộc stack, không nằm trong profile: api và
  # worker khai depends_on điều kiện service_completed_successfully
  # vào nó nên mỗi lần `docker compose up`, migration được áp xong
  # (phần đã áp được bỏ qua, chạy lại an toàn) mới tới lượt api/worker
  # khởi động. Nền tảng quản lý qua giao diện như Dokploy không chạy
  # được service one-off theo profile, nên cổng thứ tự này là cơ chế
  # kích hoạt migrate ở đó. Áp riêng khi cần:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      # DATABASE_URL của bước migrate là role MIGRATION (issue
      # #586): script cấp phát control plane suy ra đích nghiệp vụ
      # (database + role được cấp CONNECT) từ biến này, và nó là dự
      # phòng khi DATABASE_ADMIN_URL vắng mặt.
      DATABASE_URL: postgres://lms_migrator:${MIGRATOR_POSTGRES_PASSWORD:?Can dat MIGRATOR_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-lms}
      # Kết nối quản trị của cụm — CHỈ dùng ở bước cấp phát role và
      # database (hai script setup), không còn đường dữ kiện nào của
      # ứng dụng chạy bằng kết nối này.
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Can dat POSTGRES_PASSWORD trong file .env}@postgres:5432/postgres
      # Hai URL đích của mô hình role: script runtime-roles-setup
      # đảm bảo hai role tồn tại, database thuộc sở hữu của role
      # migration và role runtime chỉ giữ quyền dữ liệu; cấu hình
      # Drizzle của kho nghiệp vụ ưu tiên MIGRATION_DATABASE_URL nên
      # migration được áp bằng đúng role chủ sở hữu.
      MIGRATION_DATABASE_URL: postgres://lms_migrator:${MIGRATOR_POSTGRES_PASSWORD:?Can dat MIGRATOR_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-lms}
      RUNTIME_DATABASE_URL: postgres://lms_runtime:${RUNTIME_POSTGRES_PASSWORD:?Can dat RUNTIME_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-lms}
      CONTROL_PLANE_DATABASE_URL: postgres://lms_control_plane:${CONTROL_PLANE_POSTGRES_PASSWORD:?Can dat CONTROL_PLANE_POSTGRES_PASSWORD trong file .env}@postgres:5432/lms_control_plane
      # URL kho ngân hàng hệ thống (issue #585) — TUỲ CHỌN, truyền xuyên
      # từ file .env; chưa đặt thì chuỗi migrate bỏ qua bước (4) cấp phát +
      # migration kho ngân hàng (xem command ở cuối service này). Khi kích
      # hoạt kho ngân hàng, đặt biến này ở cả service api/worker trên
      # Dokploy (môi trường chạy) lẫn ở đây (bước migrate).
      SYSTEM_BANK_DATABASE_URL: ${SYSTEM_BANK_DATABASE_URL:-}
      # Công cụ vận hành đội kho (issue #586): các lệnh fleet:*
      # chạy MỘT LẦN qua chính service này (cùng image api, đủ cả
      # URL quản trị, URL migration và URL control plane ở trên):
      #   docker compose run --rm migrate node dist/modules/fleet/fleet-migration-runner.js
      #   docker compose run --rm migrate node dist/modules/fleet/fleet-backup.js
      #   docker compose run --rm migrate node dist/modules/fleet/fleet-restore-test.js
      # Thư mục sao lưu đặt cố định vào volume riêng fleet-backups
      # gắn ở dưới (vận hành thật thay bằng bind mount ra vùng lưu
      # trữ ngoài máy cụm). Khoá mã hoá khai báo TRƠ như các bí mật
      # tuỳ chọn ở x-api-env: chỉ truyền vào khi đã đặt trong file
      # .env — và thiếu khoá thì công cụ từ chối chụp sao lưu
      # (fail-closed, không có chế độ lưu thô).
      FLEET_BACKUP_DIR: /app/data/fleet-backups
      FLEET_BACKUP_ENCRYPTION_KEY:
    volumes:
      # Volume của thư mục sao lưu đội kho (xem ghi chú
      # FLEET_BACKUP_DIR ở khối environment của service này).
      - fleet-backups:/app/data/fleet-backups
    depends_on:
      postgres:
        condition: service_healthy
    # Thứ tự bắt buộc trong một lượt migrate: (0) cấp phát role
    # migration + role runtime và chuyển quyền sở hữu kho nghiệp vụ
    # về role migration (idempotent, script
    # runtime-roles-setup — kho đã tồn tại từ trước với đối tượng
    # thuộc role quản trị được chuyển chủ tại bước này), (1) cấp
    # phát database + role của control plane (script
    # control-plane-setup), (2) migration của kho nghiệp vụ bằng
    # role migration, (2b) ensure idempotent cho 3 bảng vệ tinh
    # của Ngân hàng hệ thống trong kho nghiệp vụ (script
    # system-bank-centre-tables-setup, issue #585 — database đã áp
    # baseline trước khi 3 bảng được nối vào file baseline thì
    # migration bỏ qua thư mục baseline, bước ensure bù đúng phần
    # đó; database mới đã có đủ qua baseline nên là no-op),
    # (3) migration của control plane bằng runner migration Kysely
    # của package (issue #639), (4) ensure phần delta schema của issue #583
    # (script centre-schema-delta-ensure — lấp 3 bảng trung tâm +
    # policy RLS và chỉ mục control plane mà bộ migration bỏ qua
    # vì delta gộp thêm vào migration đã phát hành; database mới
    # thì bước này là no-op), (5) CÓ ĐIỀU KIỆN — chỉ khi
    # SYSTEM_BANK_DATABASE_URL đã đặt: <redacted>
    # kho ngân hàng hệ thống (script system-bank-setup, issue #585)
    # rồi migration của kho ngân hàng bằng runner migration Kysely
    # của package (issue #639).
    # Bước (5) bỏ qua lặng lẽ khi biến chưa đặt để các môi trường
    # chưa kích hoạt kho ngân hàng không gãy (bài học PR #589: biến
    # bắt buộc mới làm gãy deploy). Một bước hỏng thì cả service
    # migrate hỏng và api/worker không khởi động.
    command:
      - sh
      - -c
      - "node dist/modules/fleet/runtime-roles-setup.js && node dist/modules/control-plane/control-plane-setup.js && node node_modules/@lms/db/dist/migrate/run.js centre && node dist/modules/system-bank/system-bank-centre-tables-setup.js && node node_modules/@lms/db/dist/migrate/run.js control-plane && node dist/modules/tenants/centre-schema-delta-ensure.js && if [ -n \"$SYSTEM_BANK_DATABASE_URL\" ]; then node dist/modules/system-bank/system-bank-setup.js && node node_modules/@lms/db/dist/migrate/run.js system-bank; fi"

  # Chạy một lần để seed dữ liệu mẫu (tài khoản demo + khoá học mẫu).
  # CHỈ dùng cho môi trường thử nghiệm tự host lần đầu; TUYỆT ĐỐI không
  # chạy trên cơ sở dữ liệu production đã khôi phục từ bản sao lưu:
  #   docker compose --profile seed run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    profiles: ["seed"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/modules/seed/review-seed.js"]

volumes:
  pgdata:
  redisdata:
  api-files:
  fleet-backups:
