# Cấu hình Dev Container của repo. Ba service app/db/redis dùng CHUNG
# một network namespace (network_mode: service:db) để mọi mặc định
# localhost của repo chạy đúng nguyên trạng trong container — đúng cách
# môi trường phát triển local hiện tại vận hành (PostgreSQL và Redis
# cùng máy với tiến trình ứng dụng, xem README gốc):
#   - DATABASE_URL / REDIS_URL mặc định ở apps/api/.env.example và
#     apps/worker/.env.example trỏ localhost:5432 / localhost:6379;
#   - cấu hình test (apps/api/vitest.config.ts, apps/worker/vitest.config.ts)
#     cũng ghim localhost cho DB test và Redis.
# Nhờ vậy container không cần ghi đè biến môi trường nào của repo.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/lms:cached
    # Giữ container sống để VS Code gắn vào; các lệnh dev (pnpm dev,
    # migrate, seed) do người phát triển chạy trong terminal của container.
    command: sleep infinity
    network_mode: service:db
    depends_on:
      - db
      - redis

  db:
    # Cùng image PostgreSQL mà CI dùng (postgres:18.6) — 18.x bắt buộc vì
    # khoá chính mặc định dùng hàm uuidv7() gốc của PostgreSQL 18.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # DB chính `lms`. Các DB còn lại (lms_test, lms_test_api,
      # lms_test_worker) do init-db.sql tạo thêm ở lần khởi tạo đầu tiên.
      POSTGRES_DB: lms
    volumes:
      # PostgreSQL 18 đổi bố cục: mount phải đặt tại /var/lib/postgresql
      # (image tự quản thư mục con theo major version). Mount vào
      # /var/lib/postgresql/data như khuôn của bản 17 trở xuống sẽ làm
      # container lỗi khởi động.
      - pgdata:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro

  redis:
    # Cùng image Redis mà CI dùng (redis:7).
    image: redis:7
    restart: unless-stopped
    network_mode: service:db

volumes:
  pgdata:
